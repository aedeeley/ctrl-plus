name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: windows-latest
            args: "--target aarch64-pc-windows-msvc --bundles nsis"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LICENSE_JWT_SECRET: ${{ secrets.LICENSE_JWT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ctrl+ ${{ github.ref_name }}"
          releaseBody: |
            ## ctrl+ v0.1.1

            - Fix Pro license activation (JWT verification)
            - Add "Remove from this device" to free your license key
            - Free tier stays locked until activation

            **Downloads**
            - Windows (x64): `ctrl+_0.1.1_x64-setup.exe` (recommended)
            - Windows (x64): `ctrl+_0.1.1_x64_en-US.msi`
            - Windows on ARM: `ctrl+_0.1.1_arm64-setup.exe`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
