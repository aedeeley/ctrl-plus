name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LICENSE_JWT_SECRET: ${{ secrets.LICENSE_JWT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ctrl+ ${{ github.ref_name }}"
          releaseBody: "Draft release — publishing after all builds finish."
          releaseDraft: true
          prerelease: false

    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}

  build-arm64:
    needs: build-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LICENSE_JWT_SECRET: ${{ secrets.LICENSE_JWT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          releaseId: ${{ needs.build-x64.outputs.release_id }}
          releaseDraft: true
          args: "--target aarch64-pc-windows-msvc --bundles nsis"

  publish-release:
    needs: [build-x64, build-arm64]
    if: ${{ needs.build-x64.outputs.release_id != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const releaseId = Number("${{ needs.build-x64.outputs.release_id }}");
            const tag = "${{ github.ref_name }}";
            const version = tag.replace(/^v/, "");
            const { owner, repo } = context.repo;

            if (!releaseId) {
              core.setFailed(
                `No draft release was created for ${tag}. Check the build-x64 job logs and re-run the full workflow.`
              );
              return;
            }

            const body = [
              "## What's new",
              "- Subtle fade and slide animations when the overlay opens and closes",
              "- Redesigned General settings tab with grouped sections",
              "- Moved window position controls from Appearance to General",
              "",
              "## Downloads",
              "- Windows (x64): ctrl+_" + version + "_x64-setup.exe (recommended)",
              "- Windows (x64): ctrl+_" + version + "_x64_en-US.msi",
              "- Windows on ARM: ctrl+_" + version + "_arm64-setup.exe",
            ].join("\n");

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseId,
              name: "ctrl+ " + tag,
              body,
              draft: false,
              make_latest: true,
            });
