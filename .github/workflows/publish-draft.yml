name: Publish draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v0.1.3

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ inputs.tag }}";
            const version = tag.replace(/^v/, "");
            const { owner, repo } = context.repo;

            async function findRelease() {
              try {
                const { data } = await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag,
                });
                return data;
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }

              const { data: releases } = await github.rest.repos.listReleases({
                owner,
                repo,
                per_page: 30,
              });

              const release = releases.find(
                (item) => item.tag_name === tag || item.name === `ctrl+ ${tag}`,
              );

              if (!release) {
                throw new Error(`No draft release found for ${tag}`);
              }

              return release;
            }

            const release = await findRelease();

            const body = [
              "## What's new",
              "- Fix Pro license activation (JWT verification)",
              "- Add remove-from-device to free your license key",
              "- Free tier stays locked until activation",
              "",
              "## Downloads",
              "- Windows (x64): ctrl+_" + version + "_x64-setup.exe (recommended)",
              "- Windows (x64): ctrl+_" + version + "_x64_en-US.msi",
              "- Windows on ARM: ctrl+_" + version + "_arm64-setup.exe",
            ].join("\n");

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              tag_name: tag,
              name: "ctrl+ " + tag,
              body,
              draft: false,
              make_latest: true,
            });
