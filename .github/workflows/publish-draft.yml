name: Publish draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v0.1.5

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ inputs.tag }}";
            const version = tag.replace(/^v/, "");
            const { owner, repo } = context.repo;

            async function getDraftRelease() {
              const maxAttempts = 6;
              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                  const { data } = await github.rest.repos.getReleaseByTag({
                    owner,
                    repo,
                    tag,
                  });
                  return data;
                } catch (error) {
                  if (error.status !== 404 || attempt === maxAttempts) {
                    throw error;
                  }
                  core.info(`Draft release not found yet (attempt ${attempt}/${maxAttempts}), retrying...`);
                  await new Promise((resolve) => setTimeout(resolve, 10000));
                }
              }
            }

            let release;
            try {
              release = await getDraftRelease();
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(
                  `No release exists for tag ${tag}. Run the Release workflow first so tauri-action can create a draft with build artifacts.`
                );
                return;
              }
              throw error;
            }

            const body = [
              "## What's new",
              "- Fix Pro license activation when server JWT secret differs from build default",
              "- Accept legacy ctrlplus.pro JWT secret for existing deployments",
              "- Add `npm run tauri:build:licensed` for local release builds",
              "",
              "## Downloads",
              "- Windows (x64): ctrl+_" + version + "_x64-setup.exe (recommended)",
              "- Windows (x64): ctrl+_" + version + "_x64_en-US.msi",
              "- Windows on ARM: ctrl+_" + version + "_arm64-setup.exe",
            ].join("\n");

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              name: "ctrl+ " + tag,
              body,
              draft: false,
              make_latest: true,
            });
